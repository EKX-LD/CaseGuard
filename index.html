<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>CaseGuard — USD Case Review</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --gold:#E8A000;--gold-dark:#C48500;--gold-light:#FFF3D0;
  --blue:#0070F2;--blue-light:#E1F4FF;--blue-mid:#4CB1FF;
  --dark:#111;--grey-1:#F5F6F8;--grey-2:#EAECEE;--grey-3:#C8CBD0;
  --grey-4:#6C7278;--grey-5:#3D4045;--text:#1D2329;--white:#fff;
  --green:#2E8B57;--green-light:#DCFCE7;
  --red:#D93025;--red-light:#FDECEA;
  --teal:#4E7B7B;--teal-light:#E0F2F2;
  --olive:#6B7645;--purple:#6941C6;--purple-light:#F4F3FF;
  --r:10px;--rl:16px;
  --sm:0 1px 4px rgba(0,0,0,.08);--md:0 4px 16px rgba(0,0,0,.10);--lg:0 8px 32px rgba(0,0,0,.14);
  --t:.2s ease;
  --f:"72 Brand","SAP 72",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
}
html,body{height:100%;font-family:var(--f);background:var(--grey-1);color:var(--text);overflow:hidden}
.topnav{position:sticky;top:0;z-index:200;display:flex;align-items:center;background:var(--dark);height:60px;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.topnav-logo-wrap{display:flex;align-items:center;padding:0 16px;height:100%;border-right:1px solid #2a2a2a;flex-shrink:0}
.topnav-logo{height:42px;width:auto;object-fit:contain}
.topnav-title-wrap{flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 18px}
.topnav-title{font-size:16px;font-weight:700;color:var(--white);letter-spacing:-.2px}
.topnav-subtitle{font-size:11px;color:var(--grey-3);margin-top:1px}
.topnav-actions{display:flex;align-items:center;gap:10px;padding:0 16px}
.accent-stripe{height:4px;background:linear-gradient(90deg,var(--gold) 0 25%,var(--olive) 25% 50%,var(--teal) 50% 75%,var(--blue-mid) 75% 100%)}
.tabbar{background:var(--white);border-bottom:1px solid var(--grey-2);position:sticky;top:64px;z-index:150;box-shadow:var(--sm)}
.tabbar-inner{max-width:100%;margin:0 auto;display:flex;padding:0 8px}
.tab{display:flex;align-items:center;gap:7px;padding:0 20px;height:46px;font-size:13.5px;font-weight:600;color:var(--grey-4);cursor:pointer;border-bottom:3px solid transparent;transition:var(--t);white-space:nowrap;user-select:none}
.tab:hover{color:var(--text);background:var(--grey-1)}
.tab.active{color:var(--gold-dark);border-bottom-color:var(--gold)}
.tab-icon{font-size:15px;line-height:1}
.btn{display:inline-flex;align-items:center;gap:6px;border:none;border-radius:6px;cursor:pointer;font-family:var(--f);font-weight:600;padding:8px 18px;font-size:13.5px;transition:var(--t);white-space:nowrap;text-decoration:none}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:var(--gold);color:var(--dark)}.btn-primary:hover:not(:disabled){background:var(--gold-dark)}
.btn-secondary{background:transparent;color:var(--white);border:1.5px solid rgba(255,255,255,.3)}.btn-secondary:hover:not(:disabled){background:rgba(255,255,255,.08);border-color:var(--white)}
.btn-ghost{background:transparent;color:var(--grey-4);border:1.5px solid var(--grey-3)}.an-visit-tab.active{background:#E1F4FF;color:#0070F2;border-color:#4CB1FF;font-weight:600}.btn-ghost:hover:not(:disabled){background:var(--grey-2);color:var(--text)}
.btn-blue{background:var(--blue);color:var(--white)}.btn-blue:hover:not(:disabled){background:#005AD4}
.btn-green{background:var(--green);color:var(--white)}.btn-green:hover:not(:disabled){background:#236B43}
.btn-red{background:var(--red);color:var(--white)}.btn-red:hover:not(:disabled){background:#B02018}
.btn-sm{padding:5px 12px;font-size:12px}
.user-badge{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.07);border-radius:24px;padding:5px 12px 5px 6px}
.user-avatar{width:28px;height:28px;border-radius:50%;background:var(--gold);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--dark);flex-shrink:0}
.user-name{font-size:12.5px;color:var(--white);font-weight:500;max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#app{display:flex;flex-direction:column;height:100%;overflow:hidden}
.tab-content{flex:1;display:none}
.tab-content.active{display:flex;flex-direction:column;flex:1;min-height:0;overflow:hidden}
.page{max-width:100%;width:100%;margin:0 auto;padding:12px 4px;flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
/* Analytics tab: scrollable column — content exceeds viewport height */
#content-analytics{overflow-y:auto}
#content-analytics>.page{overflow:visible;flex:none;padding-bottom:32px}
#content-home{overflow-y:auto}
#content-home>.page{overflow:visible;flex:none;padding-bottom:32px}
#content-admin{overflow-y:auto}
#content-admin>.page{overflow:visible;flex:none;padding-bottom:32px}
#loginScreen{display:flex;align-items:center;justify-content:center;min-height:calc(100vh - 68px);padding:40px 20px}
.login-card{background:var(--white);border-radius:var(--rl);box-shadow:var(--lg);padding:48px 52px;max-width:440px;width:100%;text-align:center}
.login-logo-wrap{background:var(--dark);border-radius:12px;padding:16px 20px;margin-bottom:28px;display:inline-block}
.login-logo{height:72px;width:auto}
.login-title{font-size:22px;font-weight:700;color:var(--text);margin-bottom:4px}
.login-brand{font-size:13px;color:var(--gold-dark);font-weight:600;margin-bottom:14px}
.login-desc{font-size:14px;color:var(--grey-4);line-height:1.6;margin-bottom:16px}
hr.div{border:none;border-top:1px solid var(--grey-2);margin:20px 0}
.login-footer{font-size:11.5px;color:var(--grey-4);margin-top:16px}
.login-footer a{color:var(--blue);text-decoration:none}
.stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:14px;margin-bottom:22px}
.stat-card{background:var(--white);border-radius:var(--r);box-shadow:var(--sm);padding:16px 14px;display:flex;align-items:center;gap:12px;border-left:4px solid transparent;transition:var(--t)}
.stat-card:hover{box-shadow:var(--md);transform:translateY(-1px)}
.stat-card.c1{border-left-color:var(--gold)}.stat-card.c2{border-left-color:var(--blue)}.stat-card.c3{border-left-color:var(--green)}.stat-card.c4{border-left-color:var(--teal)}.stat-card.c5{border-left-color:var(--purple)}.stat-card.c6{border-left-color:var(--red)}
.stat-icon-wrap{width:40px;height:40px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0}
.stat-card.c1 .stat-icon-wrap{background:var(--gold-light)}.stat-card.c2 .stat-icon-wrap{background:var(--blue-light)}.stat-card.c3 .stat-icon-wrap{background:var(--green-light)}.stat-card.c4 .stat-icon-wrap{background:var(--teal-light)}.stat-card.c5 .stat-icon-wrap{background:var(--purple-light)}.stat-card.c6 .stat-icon-wrap{background:var(--red-light)}
.stat-num{font-size:22px;font-weight:700;color:var(--text);line-height:1}
.stat-label{font-size:11px;color:var(--grey-4);margin-top:2px}
.section-card{background:var(--white);border-radius:var(--r);box-shadow:var(--sm);padding:18px 20px;margin-bottom:18px}
.card-title{font-size:14px;font-weight:700;color:var(--text);margin-bottom:14px;display:flex;align-items:center;gap:8px;padding-bottom:10px;border-bottom:1px solid var(--grey-2)}
.card-title-icon{width:24px;height:24px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.badge{display:inline-flex;align-items:center;border-radius:12px;padding:2px 9px;font-size:11px;font-weight:700;margin-left:6px}
.badge.gold{background:var(--gold-light);color:var(--gold-dark)}.badge.blue{background:var(--blue-light);color:var(--blue)}.badge.green{background:var(--green-light);color:var(--green)}.badge.red{background:var(--red-light);color:var(--red)}
/* Toolbar */
.toolbar{background:var(--white);border-radius:var(--r);box-shadow:var(--sm);padding:11px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.search-wrap{position:relative;flex:1;min-width:200px}
.search-icon-inp{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--grey-4);pointer-events:none;font-size:13px}
.search-input{width:100%;border:1.5px solid var(--grey-3);border-radius:6px;padding:7px 10px 7px 32px;font-family:var(--f);font-size:13px;color:var(--text);transition:var(--t);background:var(--grey-1)}
.search-input:focus{outline:none;border-color:var(--blue);background:var(--white);box-shadow:0 0 0 3px rgba(0,112,242,.12)}
.filter-select{border:1.5px solid var(--grey-3);border-radius:6px;padding:7px 10px;font-family:var(--f);font-size:13px;color:var(--text);background:var(--grey-1);cursor:pointer}
.filter-select:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,112,242,.12)}
.view-toggle{display:flex;border:1.5px solid var(--grey-3);border-radius:6px;overflow:hidden}
.view-btn{padding:6px 9px;background:none;border:none;cursor:pointer;color:var(--grey-4);transition:var(--t)}
.view-btn.active{background:var(--blue);color:var(--white)}.view-btn:hover:not(.active){background:var(--grey-2)}
/* Breadcrumb */
.breadcrumb{display:flex;align-items:center;gap:4px;flex-wrap:wrap;margin-bottom:12px;font-size:12.5px}
.bc-item{color:var(--blue);cursor:pointer;font-weight:500;padding:3px 6px;border-radius:4px;transition:var(--t)}.bc-item:hover{background:var(--blue-light)}
.bc-sep{color:var(--grey-3);font-size:12px}
/* Section header */
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap;gap:8px}
.section-title{font-size:15px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:8px}
/* File grid/list */
#fileContainer{min-height:240px;position:relative}
.file-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.file-list{display:flex;flex-direction:column;gap:3px}
.file-card{background:var(--white);border-radius:var(--r);box-shadow:var(--sm);padding:15px 13px 12px;cursor:pointer;transition:var(--t);border:1.5px solid transparent;position:relative;overflow:hidden}
.file-card:hover{box-shadow:var(--md);border-color:var(--gold);transform:translateY(-2px)}
.file-card.folder{border-top:3px solid var(--gold)}
.file-card-icon{font-size:30px;margin-bottom:8px;display:block}
.file-card-name{font-size:12px;font-weight:600;color:var(--text);overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.4;margin-bottom:5px}
.file-card-meta{font-size:10.5px;color:var(--grey-4)}
.file-card-actions{position:absolute;top:6px;right:6px;display:none;gap:4px}
.file-card:hover .file-card-actions{display:flex}
.act-btn{width:24px;height:24px;border-radius:5px;border:none;cursor:pointer;font-size:11px;display:flex;align-items:center;justify-content:center;transition:var(--t)}
.act-btn.dl{background:var(--blue-light);color:var(--blue)}.act-btn.dl:hover{background:var(--blue);color:var(--white)}
.act-btn.sp{background:var(--gold-light);color:var(--gold-dark)}.act-btn.sp:hover{background:var(--gold);color:var(--dark)}
.file-row{background:var(--white);border-radius:7px;padding:8px 13px;display:flex;align-items:center;gap:11px;cursor:pointer;transition:var(--t);border:1.5px solid transparent}
.file-row:hover{border-color:var(--gold);box-shadow:var(--sm)}
.file-row-icon{font-size:19px;flex-shrink:0;width:24px;text-align:center}
.file-row-info{flex:1;min-width:0}
.file-row-name{font-size:12.5px;font-weight:600;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file-row-meta{font-size:10.5px;color:var(--grey-4);margin-top:1px}
.file-row-size{font-size:11px;color:var(--grey-4);flex-shrink:0;width:72px;text-align:right}
.file-row-date{font-size:11px;color:var(--grey-4);flex-shrink:0;width:128px;text-align:right}
.file-row-acts{display:flex;gap:5px;flex-shrink:0;opacity:0;transition:var(--t)}
.file-row:hover .file-row-acts{opacity:1}
.list-hdr{display:none;align-items:center;gap:12px;padding:4px 13px;font-size:10px;color:var(--grey-4);font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.list-hdr.vis{display:flex}
/* Empty / Loading */
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 20px;text-align:center;color:var(--grey-4);grid-column:1/-1}
.empty-icon{font-size:44px;margin-bottom:12px;opacity:.4}.empty-title{font-size:14px;font-weight:600;color:var(--grey-5);margin-bottom:5px}.empty-desc{font-size:12.5px}
.loading-overlay{position:absolute;inset:0;background:rgba(255,255,255,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:var(--r);z-index:10;display:none}
.spinner{width:32px;height:32px;border:3px solid var(--grey-2);border-top-color:var(--gold);border-radius:50%;animation:spin .7s linear infinite}
.spinner-text{font-size:12px;color:var(--grey-4);margin-top:10px}
@keyframes spin{to{transform:rotate(360deg)}}
/* Toast */
#toastContainer{position:fixed;top:74px;right:18px;z-index:9999;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.toast{background:var(--dark);color:var(--white);border-radius:8px;padding:10px 14px;font-size:13px;box-shadow:var(--lg);display:flex;align-items:center;gap:8px;max-width:330px;pointer-events:all;animation:slideIn .25s ease}
.toast.success{background:var(--green)}.toast.error{background:var(--red)}.toast.warning{background:var(--gold);color:var(--dark)}
.toast-close{margin-left:auto;background:none;border:none;color:inherit;cursor:pointer;font-size:15px;opacity:.7;padding:0 0 0 6px}
@keyframes slideIn{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:translateX(0)}}
/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:300;display:none;align-items:center;justify-content:center}
.modal-overlay.open{display:flex}
.modal-panel{background:var(--white);border-radius:var(--rl);box-shadow:var(--lg);width:90%;max-width:480px;padding:24px 28px;position:relative;animation:panelIn .2s ease}
@keyframes panelIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
.modal-close{position:absolute;top:12px;right:12px;background:var(--grey-2);border:none;border-radius:50%;width:27px;height:27px;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;transition:var(--t)}.modal-close:hover{background:var(--grey-3)}
.det-icon{font-size:44px;margin-bottom:10px}.det-name{font-size:16px;font-weight:700;color:var(--text);margin-bottom:3px;word-break:break-word}
.det-path{font-size:11px;color:var(--grey-4);margin-bottom:16px}
.det-table{width:100%;border-collapse:collapse;margin-bottom:16px}
.det-table td{padding:6px 0;font-size:12px;border-bottom:1px solid var(--grey-2)}
.det-table tr:last-child td{border-bottom:none}
.det-table .lbl{color:var(--grey-4);width:100px}.det-table .val{color:var(--text);font-weight:500}
.det-actions{display:flex;gap:8px;flex-wrap:wrap}
/* Analytics */
.analytics-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:16px;margin-bottom:18px}
.chart-card{background:var(--white);border-radius:var(--r);box-shadow:var(--sm);padding:18px 20px}
.chart-title{font-size:13px;font-weight:700;color:var(--text);margin-bottom:14px;display:flex;align-items:center;justify-content:space-between}
.chart-sub{font-size:10.5px;color:var(--grey-4);font-weight:400}
.chart-wrap{position:relative;height:210px}
.chart-wrap canvas{max-height:210px}
.activity-list{display:flex;flex-direction:column;gap:7px;max-height:210px;overflow-y:auto}
.activity-item{display:flex;align-items:center;gap:9px;padding:7px 9px;background:var(--grey-1);border-radius:7px;font-size:12px}
.activity-icon{font-size:15px;flex-shrink:0;width:22px;text-align:center}
.activity-detail{flex:1;min-width:0}
.activity-name{font-weight:600;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.activity-time{font-size:10.5px;color:var(--grey-4);margin-top:1px}
.activity-badge{font-size:10px;font-weight:700;border-radius:10px;padding:2px 7px;flex-shrink:0}
.activity-badge.open{background:var(--blue-light);color:var(--blue)}.activity-badge.dl{background:var(--green-light);color:var(--green)}.activity-badge.nav{background:var(--gold-light);color:var(--gold-dark)}
/* Admin */
.admin-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:16px}
.admin-card{background:var(--white);border-radius:var(--r);box-shadow:var(--sm);padding:18px 20px}
.admin-card.full-width{grid-column:1/-1}
.admin-card-title{font-size:13.5px;font-weight:700;color:var(--text);margin-bottom:14px;display:flex;align-items:center;gap:8px;padding-bottom:10px;border-bottom:1px solid var(--grey-2)}
.info-row{display:flex;justify-content:space-between;align-items:flex-start;padding:6px 0;border-bottom:1px solid var(--grey-2);font-size:12.5px}
.info-row:last-child{border-bottom:none}
.info-row .lbl{color:var(--grey-4);font-size:11.5px;font-weight:500;flex-shrink:0;padding-right:10px}
.info-row .val{color:var(--text);font-weight:600;text-align:right;font-size:11.5px;max-width:220px;word-break:break-all}
.status-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;display:inline-block;margin-right:5px}
.status-dot.online{background:var(--green)}.status-dot.warn{background:var(--gold)}.status-dot.error{background:var(--red)}
.perm-badge{font-size:10.5px;font-weight:700;border-radius:10px;padding:2px 8px}
.perm-badge.read{background:var(--green-light);color:var(--green)}
.perm-badge.write{background:var(--blue-light);color:var(--blue)}
.perm-badge.admin{background:var(--gold-light);color:var(--gold-dark)}
.perm-row{display:flex;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--grey-2);font-size:12px}
.perm-row:last-child{border-bottom:none}
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--grey-2);font-size:12.5px}
.toggle-row:last-child{border-bottom:none}
.toggle-lbl{color:var(--text);font-weight:500}
.toggle-sub{font-size:10.5px;color:var(--grey-4);margin-top:1px}
.toggle{position:relative;width:38px;height:21px;flex-shrink:0}
.toggle input{opacity:0;width:0;height:0;position:absolute}
.toggle-slider{position:absolute;inset:0;background:var(--grey-3);border-radius:11px;cursor:pointer;transition:var(--t)}
.toggle-slider::before{content:"";position:absolute;width:15px;height:15px;left:3px;bottom:3px;background:var(--white);border-radius:50%;transition:var(--t)}
.toggle input:checked + .toggle-slider{background:var(--gold)}
.toggle input:checked + .toggle-slider::before{transform:translateX(17px)}
/* Upload zone */
.upload-zone{border:2px dashed var(--grey-3);border-radius:10px;padding:28px 20px;text-align:center;transition:var(--t);cursor:pointer;background:var(--grey-1)}
.upload-zone:hover,.upload-zone.drag{border-color:var(--gold);background:var(--gold-light)}
.upload-zone-icon{font-size:36px;margin-bottom:10px;opacity:.7}
.upload-zone-title{font-size:14px;font-weight:600;color:var(--text);margin-bottom:4px}
.upload-zone-sub{font-size:12px;color:var(--grey-4)}
.upload-selected{background:var(--white);border:1.5px solid var(--grey-2);border-radius:8px;padding:10px 14px;display:flex;align-items:center;gap:10px;margin-top:12px;font-size:12.5px}
.upload-sel-icon{font-size:20px;flex-shrink:0}
.upload-sel-name{flex:1;min-width:0;font-weight:600;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.upload-sel-size{color:var(--grey-4);flex-shrink:0;font-size:11.5px}
.upload-progress{margin-top:10px}
.upload-progress-bar{height:6px;background:var(--grey-2);border-radius:3px;overflow:hidden}
.upload-progress-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--blue));border-radius:3px;transition:width .3s ease;width:0}
.upload-progress-label{font-size:11px;color:var(--grey-4);margin-top:5px;text-align:center}
/* Admin user table */
.user-table{width:100%;border-collapse:collapse}
.user-table th{font-size:10.5px;font-weight:700;color:var(--grey-4);text-transform:uppercase;letter-spacing:.5px;padding:6px 10px;border-bottom:2px solid var(--grey-2);text-align:left;white-space:nowrap}
.user-table td{padding:8px 10px;font-size:12.5px;border-bottom:1px solid var(--grey-2);vertical-align:middle}
.user-table tr:last-child td{border-bottom:none}
.user-table tr:hover td{background:var(--grey-1)}
/* Masterlist data table */
.data-banner{background:var(--white);border-radius:var(--r);box-shadow:var(--sm);padding:14px 18px;margin-bottom:14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.data-banner-icon{font-size:22px;flex-shrink:0}
.data-banner-info{flex:1;min-width:0}
.data-banner-title{font-size:13px;font-weight:700;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.data-banner-sub{font-size:11px;color:var(--grey-4);margin-top:2px}
.data-table-wrap{background:var(--white);border-radius:var(--r);box-shadow:var(--sm);overflow:hidden;margin-bottom:18px}
.data-table-toolbar{padding:12px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--grey-2);flex-wrap:wrap}
.data-table{width:100%;border-collapse:collapse;min-width:650px}
.data-table th{font-size:11px;font-weight:700;color:var(--grey-5);text-transform:uppercase;letter-spacing:.4px;padding:10px 14px;background:var(--grey-1);border-bottom:2px solid var(--grey-2);text-align:left;white-space:nowrap;position:sticky;top:0}
.data-table td{padding:9px 14px;font-size:12.5px;border-bottom:1px solid var(--grey-2);color:var(--text);vertical-align:middle}
.data-table tr:last-child td{border-bottom:none}
.data-table tr:hover td{background:#FEFBF2}
.data-table-scroll{overflow-x:auto;overflow-y:auto;max-height:500px}
.data-table .email-cell{color:var(--blue);font-size:12px}
.data-table .role-pill{display:inline-block;background:var(--gold-light);color:var(--gold-dark);font-size:10.5px;font-weight:700;border-radius:10px;padding:2px 8px}
.data-loading{display:flex;align-items:center;justify-content:center;padding:48px;gap:12px;color:var(--grey-4);font-size:13px}
.pagination{display:flex;align-items:center;gap:6px;padding:10px 16px;border-top:1px solid var(--grey-2);font-size:12.5px;flex-wrap:wrap}
.pg-btn{width:28px;height:28px;border:1.5px solid var(--grey-3);border-radius:5px;background:none;cursor:pointer;font-size:12.5px;display:flex;align-items:center;justify-content:center;transition:var(--t);font-family:var(--f)}
.pg-btn:hover:not(:disabled){background:var(--grey-2)}.pg-btn.active{background:var(--gold);color:var(--dark);border-color:var(--gold)}.pg-btn:disabled{opacity:.4;cursor:not-allowed}
.pg-info{color:var(--grey-4);margin-left:auto}
@media(max-width:640px){
  .topnav{flex-wrap:wrap;height:auto;padding:8px;gap:6px}
  .tab{padding:0 10px;font-size:12px}
  .page{padding:4px 2px}
  .login-card{padding:22px 16px}
  .file-row-size,.file-row-date{display:none}
  .welcome-banner{flex-wrap:wrap}.welcome-actions{margin-left:0}
  .admin-grid{grid-template-columns:1fr}
  .analytics-grid{grid-template-columns:1fr}
}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:var(--grey-1)}
::-webkit-scrollbar-thumb{background:var(--grey-3);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--grey-4)}

/* ── CaseGuard Notebook Page Flags + Filter Panel ─────────────────────── */

/* 3-column notebook body */
.nb-body{display:flex;flex:1;min-height:0;background:#fff;border-radius:14px;
  overflow:hidden;box-shadow:0 4px 28px rgba(0,0,0,.09)}

/* ──────────── LEFT: page flags ──────────────────────────────────────── */
/* ──────────── LEFT: page flags ──────────────────────────────────────── */
.nb-flags-col{width:210px;min-width:210px;flex-shrink:0;background:#EAECF6;
  padding:18px 0 18px;display:flex;flex-direction:column;gap:3px;
  border-right:3px solid #0070F2;overflow-y:auto}
.nb-flag{display:flex;align-items:flex-start;gap:10px;
  padding:12px 14px 12px 16px;cursor:pointer;
  background:#D6DAF0;
  border:1.5px solid #C0C8DC;border-left:4px solid transparent;
  border-radius:8px;
  transition:background .18s,border-color .18s,padding-left .18s;
  user-select:none;line-height:1.38;position:relative;z-index:1}
.nb-flag:hover{background:#DDE2F6;border-left-color:#8A96C4;padding-left:20px}
.nb-flag.nb-active{
  background:#fff;
  border:1.5px solid #0070F2;
  border-left:4px solid #0070F2;
  border-right:3px solid #fff;   /* covers spine → flags merges into page */
  border-radius:10px 0 0 10px;
  margin-right:-3px;
  padding-left:18px;
  z-index:3;
  box-shadow:2px 0 0 #fff}
.nb-flag-num{min-width:22px;height:22px;border-radius:50%;
  background:#B8BFDA;color:#fff;font-size:9.5px;font-weight:700;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;margin-top:2px;
  transition:background .18s,transform .18s}
.nb-flag.nb-active .nb-flag-num{background:#0070F2;transform:scale(1.1)}
.nb-flag-lbl{font-size:11.5px;font-weight:500;color:#5A6380;
  transition:color .18s;word-break:normal;white-space:normal}
.nb-flag.nb-active .nb-flag-lbl{color:#00144A;font-weight:700}
/* Filter-info icon on each left tab */
.fi-btn{flex-shrink:0;margin-left:auto;margin-top:1px;background:none;border:none;cursor:pointer;
  padding:2px 3px;border-radius:4px;opacity:.45;transition:opacity .15s,background .15s;
  display:flex;align-items:center;justify-content:center;color:#5A6380}
.fi-btn:hover{opacity:1;background:rgba(0,112,242,.10);color:#0070F2}
.nb-flag.nb-active .fi-btn{opacity:.65;color:#0070F2}
.nb-flag.nb-active .fi-btn:hover{opacity:1;background:rgba(0,112,242,.15)}

/* ── Status View left tabs ──────────────────────────────────────────────── */
.nb-sv-divider{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;
  color:#8A96C4;padding:12px 16px 4px;user-select:none}
.nb-sv-flag{display:flex;align-items:center;gap:9px;
  padding:10px 14px 10px 16px;cursor:pointer;
  background:#D6DAF0;border:1.5px solid #C0C8DC;border-left:4px solid transparent;
  border-radius:8px;transition:background .18s,border-color .18s,padding-left .18s;
  user-select:none;position:relative;z-index:1}
.nb-sv-flag:hover{background:#DDE2F6;border-left-color:#8A96C4;padding-left:20px}
.nb-sv-flag.nb-active{background:#fff;border:1.5px solid var(--sv-color,#0070F2);
  border-left:4px solid var(--sv-color,#0070F2);border-right:3px solid #fff;
  border-radius:10px 0 0 10px;margin-right:-3px;padding-left:18px;z-index:3;box-shadow:2px 0 0 #fff}
.nb-sv-dot{width:11px;height:11px;border-radius:50%;flex-shrink:0;
  background:var(--sv-color,#0070F2);box-shadow:0 0 0 2px rgba(0,0,0,.07)}
.nb-sv-lbl{font-size:12px;font-weight:600;color:#4A5270;flex:1}
.nb-sv-flag.nb-active .nb-sv-lbl{color:#00144A;font-weight:700}
.nb-sv-ct{font-size:10px;font-weight:700;min-width:20px;text-align:center;
  background:#C8CCDC;color:#fff;padding:2px 5px;border-radius:10px;
  transition:background .18s}
.nb-sv-flag.nb-active .nb-sv-ct{background:var(--sv-color,#0070F2)}
/* dark mode */
body.dark-mode .nb-sv-divider{color:#6B7280}
body.dark-mode .nb-sv-flag{background:#252B33;border-color:#373737}
body.dark-mode .nb-sv-flag:hover{background:#2A3140}
body.dark-mode .nb-sv-flag.nb-active{background:#00144A;border-color:var(--sv-color,#4CB1FF);box-shadow:2px 0 0 #1A2030}
body.dark-mode .nb-sv-flag.nb-active .nb-sv-lbl{color:#E0E7FF}
body.dark-mode .nb-sv-ct{background:#373737;color:#9CA3AF}

/* ── Status view header panel (replaces nb-page description) ───────────── */
#cg-status-header{flex-shrink:0;padding:0 0 6px}
.nb-sv-ph-badge{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;
  justify-content:center;font-size:15px;flex-shrink:0;
  background:var(--sv-bg,#E1F4FF);color:var(--sv-color,#0070F2)}
.nb-sv-ph-body{flex:1;min-width:0}
.nb-sv-ph-title{font-size:15px;font-weight:700;color:#00144A}
.nb-sv-ph-desc{font-size:11.5px;color:#6B7280;margin-top:2px}
body.dark-mode .nb-sv-ph-title{color:#E0E7FF}
body.dark-mode .nb-sv-ph-badge{background:#223548}
/* Filter-info popup modal */
#fiModal{display:none;position:fixed;inset:0;z-index:500;align-items:center;justify-content:center;
  background:rgba(0,0,0,.38)}
#fiModal.open{display:flex}
#fiModal-panel{background:#fff;border-radius:12px;box-shadow:0 8px 32px rgba(0,0,0,.18);
  width:92%;max-width:520px;max-height:82vh;overflow-y:auto;
  padding:0;position:relative;animation:panelIn .18s ease}
#fiModal-head{padding:18px 20px 14px;border-bottom:1px solid #EAECEE;
  display:flex;align-items:flex-start;gap:12px}
.fi-head-badge{min-width:28px;height:28px;border-radius:50%;background:#0070F2;
  color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;
  justify-content:center;flex-shrink:0;margin-top:1px}
.fi-head-right{flex:1;min-width:0}
.fi-head-title{font-size:13.5px;font-weight:700;color:#1D2329;line-height:1.3}
.fi-head-sub{font-size:11px;color:#6B7280;margin-top:3px}
#fiModal-close{position:absolute;top:12px;right:12px;background:#EAECEE;border:none;
  border-radius:50%;width:26px;height:26px;cursor:pointer;font-size:13px;
  display:flex;align-items:center;justify-content:center;color:#374151;
  transition:background .14s}
#fiModal-close:hover{background:#D1D5DB}
#fiModal-body{padding:16px 20px 20px}
.fi-section{margin-bottom:14px}
.fi-section:last-child{margin-bottom:0}
.fi-section-lbl{font-size:10px;font-weight:700;color:#9EA8B3;text-transform:uppercase;
  letter-spacing:.6px;margin-bottom:7px}
.fi-rule{display:flex;gap:9px;align-items:flex-start;margin-bottom:6px;font-size:12px;color:#374151;line-height:1.5}
.fi-rule:last-child{margin-bottom:0}
.fi-dot{width:6px;height:6px;border-radius:50%;background:#0070F2;flex-shrink:0;margin-top:5px}
.fi-dot.red{background:#DC2626}
.fi-dot.amber{background:#E8A000}
.fi-field{display:inline-block;background:#EEF2FF;color:#3730A3;font-size:10.5px;font-weight:600;
  padding:1px 6px;border-radius:4px;margin-right:3px;white-space:nowrap}
.fi-val{display:inline-block;background:#F0FDF4;color:#065F46;font-size:10.5px;font-weight:600;
  padding:1px 6px;border-radius:4px;margin-right:3px;font-family:monospace;white-space:nowrap}
.fi-val.neg{background:#FEF2F2;color:#991B1B}
.fi-divider{border:none;border-top:1px dashed #E5E7EB;margin:10px 0}
.fi-note{background:#F0F6FF;border:1px solid #BFDBFE;border-radius:6px;padding:9px 12px;
  font-size:11.5px;color:#1D4ED8;line-height:1.55}
body.dark-mode .fi-btn{color:#9EA8B3}
body.dark-mode .fi-btn:hover{background:rgba(76,177,255,.12);color:#4CB1FF}
body.dark-mode .nb-flag.nb-active .fi-btn{color:#4CB1FF}
body.dark-mode #fiModal-panel{background:#1D2329;border:1px solid #373737}
body.dark-mode #fiModal-head{border-color:#373737}
body.dark-mode .fi-head-title{color:#E5E7EB}
body.dark-mode .fi-head-sub{color:#9EA8B3}
body.dark-mode #fiModal-close{background:#373737;color:#E5E7EB}
body.dark-mode #fiModal-close:hover{background:#4B5563}
body.dark-mode .fi-rule{color:#D1D5DB}
body.dark-mode .fi-note{background:#162032;border-color:#1E3A5F;color:#93C5FD}
/* Cases flag */


/* ──────────── CENTER: content area ──────────────────────────────────── */
.nb-content-col{flex:1;min-width:0;padding:12px 8px 12px 10px;
  background:#fff;display:flex;flex-direction:column;overflow:hidden}
.nb-page{display:none}
.nb-page.nb-active{display:block;flex-shrink:0}
/* cases content grows to fill remaining column height */
#nb-cases-content{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
#nb-cases-count{flex-shrink:0}

/* ──────────── RIGHT: filter panel ───────────────────────────────────── */
.nb-filter-col{width:240px;min-width:240px;flex-shrink:0;
  background:#F6F8FE;border-left:1px solid #E4E8F5;
  display:flex;flex-direction:column;overflow:hidden}
.nb-filter-inner{padding:18px 15px 20px;overflow-y:auto;flex:1}
.nb-flt-hdr{display:flex;justify-content:space-between;align-items:center;
  margin-bottom:14px;padding-bottom:11px;border-bottom:2px solid #E4EAFF}
.nb-flt-hdr-lbl{font-size:13px;font-weight:700;color:#00144A;letter-spacing:.01em}
.nb-flt-clear{background:none;border:1.5px solid #D0D4E4;border-radius:6px;
  padding:4px 10px;font-size:11px;color:#6B7280;cursor:pointer;
  transition:border-color .18s,color .18s}
.nb-flt-clear:hover{border-color:#0070F2;color:#0070F2}
/* search */
.nb-flt-srch{position:relative;margin-bottom:14px}
.nb-flt-srch input{width:100%;padding:9px 12px 9px 34px;
  border:1.5px solid #D0D4E4;border-radius:8px;
  font-size:12.5px;background:#fff;color:#1a1a2e;
  box-sizing:border-box;transition:border-color .18s,box-shadow .18s}
.nb-flt-srch input:focus{border-color:#0070F2;outline:none;
  box-shadow:0 0 0 3px rgba(0,112,242,.1)}
.nb-flt-srch-ico{position:absolute;left:10px;top:50%;
  transform:translateY(-50%);font-size:14px;opacity:.45;pointer-events:none}
/* filter groups */
.nb-fg{margin-bottom:7px;border-radius:8px;overflow:hidden;
  border:1px solid #E4E8F5}
.nb-fg-head{display:flex;justify-content:space-between;align-items:center;
  padding:9px 13px;background:#EEF2FF;cursor:pointer;
  font-size:12px;font-weight:600;color:#2D3452;user-select:none;
  transition:background .15s}
.nb-fg-head:hover{background:#E4EAFF}
.nb-fg-arr{font-size:10px;color:#0070F2;
  transition:transform .2s;display:inline-block}
.nb-fg-body{padding:8px 10px;max-height:158px;overflow-y:auto;
  display:none;background:#fff}
.nb-fg-body.open{display:block}
.nb-fg-cb{display:flex;align-items:center;gap:8px;padding:5px 6px;
  font-size:12px;color:#374151;cursor:pointer;border-radius:5px;
  transition:background .15s;user-select:none}
.nb-fg-cb:hover{background:#F0F4FF}
.nb-fg-cb input[type=checkbox]{cursor:pointer;accent-color:#0070F2;
  width:13px;height:13px;flex-shrink:0}
.nb-fg-empty{font-size:11px;color:#A0A6B8;padding:4px 2px;font-style:italic}
/* date range */
.nb-date-pair{margin-bottom:10px}
.nb-date-lbl{display:block;font-size:10.5px;color:#6B7280;font-weight:600;
  text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.nb-fg-body input[type=date]{width:100%;padding:7px 10px;
  border:1.5px solid #D0D4E4;border-radius:7px;font-size:12px;
  color:#374151;background:#fff;box-sizing:border-box;cursor:pointer}
.nb-fg-body input[type=date]:focus{border-color:#0070F2;outline:none}
/* record count */
.nb-cases-cnt{font-size:11.5px;color:#6B7280;text-align:center;
  padding:8px 4px;margin-top:8px;border-top:1px dashed #E4E8F5}
.nb-tbl-toolbar{display:flex;align-items:center;justify-content:space-between;
  padding:6px 2px 2px 2px;margin-top:6px}
.nb-export-btn{display:inline-flex;align-items:center;gap:6px;
  padding:5px 14px;font-size:12px;font-weight:600;font-family:inherit;
  background:#0070F2;color:#fff;border:none;border-radius:6px;cursor:pointer;
  transition:background .15s}
.nb-export-btn:hover{background:#0057C2}
.nb-export-btn svg{flex-shrink:0}
body.dark-mode .nb-export-btn{background:#4CB1FF;color:#00144A}
body.dark-mode .nb-export-btn:hover{background:#2A99EE;color:#00144A}
/* ── Overview bar chart ─────────────────────────────────── */
#ov-team-chart{overflow-x:auto;padding:4px 0 8px}
#ov-team-chart canvas{display:block;max-height:260px}
.ov-chart-legend{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:10px;justify-content:center}
.ov-chart-legend-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text)}
.ov-chart-legend-dot{display:inline-block;width:11px;height:11px;border-radius:2px;flex-shrink:0}

/* ──────────── Case Count Tile Bar (CaseGuard) ────────────────────────── */
/* Reuses .stats-row + .stat-card — alignment overrides + active/loading added */
#nbCountBar{
  display:grid;
  grid-template-columns:repeat(8,1fr);   /* 4 category + total + new + working + updated */
  gap:8px;
  margin-bottom:16px
}
/* Every card: equal height, consistent internal alignment */
#nbCountBar .stat-card{
  align-items:center;
  min-height:72px;
  box-sizing:border-box;
  width:100%;
  cursor:pointer;
  padding:12px 10px;
  gap:8px
}
/* Status tiles: lighter weight vs category tiles */
#nbCountBar .nb-sv-tile { background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.07); }
body.dark-mode #nbCountBar .nb-sv-tile { background: #1D2329; }
/* Text block stretches to fill remaining card width after the icon */
#nbCountBar .stat-card > div{
  flex:1;
  min-width:0
}
/* Count number: uniform size */
#nbCountBar .stat-num{
  font-size:22px;
  font-weight:700;
  line-height:1;
  white-space:nowrap
}
/* Label: wrap consistently, two-line max */
#nbCountBar .stat-label{
  font-size:11px;
  line-height:1.35;
  margin-top:3px;
  word-break:normal;
  white-space:normal
}
.stat-card.nb-count-active{
  box-shadow:0 4px 18px rgba(0,112,242,.18);
  transform:translateY(-1px)
}
.stat-card.nb-count-active .stat-num{color:var(--blue)}
/* loading pulse on stat-num */
.stat-num.nb-ct-loading{
  color:var(--grey-3);
  animation:nbctpulse 1.1s ease-in-out infinite
}
@keyframes nbctpulse{0%,100%{opacity:.35}50%{opacity:1}}

/* ── Total Called Out Tile (v93) ──────────────────────────── */
/* Total tile (6th card in #nbCountBar) */
#nbct-6{
  background:#0070F2;
  border-left-color:#003D99;
  cursor:default;
  user-select:none
}
#nbct-6 .stat-icon-wrap{background:rgba(255,255,255,.18);color:#fff}
#nbct-6 #nbct-num-total{color:#fff}
#nbct-6 .stat-label{color:rgba(255,255,255,.85)}
#nbct-num-total.nb-ct-loading{
  color:rgba(255,255,255,.35);
  animation:nbctpulse 1.1s ease-in-out infinite
}
/* Overview total tile */
#ov-ct-total{background:#0070F2;border-left:4px solid #0050BF;cursor:default}
#ov-ct-total .stat-icon-wrap{background:rgba(255,255,255,.18);color:#fff}
#ov-ct-total #ov-total-count{color:#fff}
#ov-ct-total .stat-label{color:rgba(255,255,255,.85)}
body.dark-mode #ov-ct-total{background:#003EB3;border-left-color:#001F6B}
/* Overview stats: force all 8 tiles onto one row, scaled down */
#ov-cg-stats{grid-template-columns:repeat(8,minmax(0,1fr));gap:10px;margin-bottom:14px}
#ov-cg-stats .stat-card{padding:11px 10px;gap:8px}
#ov-cg-stats .stat-icon-wrap{width:32px;height:32px;font-size:14px;border-radius:7px;flex-shrink:0}
#ov-cg-stats .stat-num{font-size:17px}
#ov-cg-stats .stat-label{font-size:11px;line-height:1.3}
/* dark mode */
body.dark-mode #nbct-6{background:#003EB3;border-left-color:#001F6B}
body.dark-mode .stat-num.nb-ct-loading{color:var(--grey-5)}

/* ──────────── Shared page content ────────────────────────────────────── */
.nb-ph{display:flex;align-items:center;gap:14px;
  margin-bottom:14px;padding-bottom:14px;border-bottom:2px solid #EEF2FF}
.nb-badge{min-width:40px;height:40px;border-radius:50%;
  background:linear-gradient(135deg,#0134BF,#0070F2);color:#fff;
  font-size:16px;font-weight:700;display:flex;align-items:center;
  justify-content:center;flex-shrink:0;
  box-shadow:0 3px 12px rgba(0,112,242,.28)}
.nb-title{font-size:18px;font-weight:700;color:#00144A;line-height:1.25}
.nb-sub{font-size:12px;color:#0070F2;margin-top:3px;font-weight:500}.nb-sub-icon{font-size:13px;flex-shrink:0;line-height:1;margin-top:1px}
/* ── Static tab description box ──────────────────────────────────────── */
.nb-ph-body{display:flex;align-items:center;gap:14px;flex:1;min-width:0;flex-wrap:wrap}
.nb-desc-box{display:inline-flex;align-items:flex-start;gap:7px;background:#E1F4FF;
  border:1.5px solid #4CB1FF;border-radius:8px;padding:6px 14px;flex:1;min-width:180px}
.nb-desc-lbl{font-weight:700;color:#0070F2;white-space:nowrap;flex-shrink:0;font-size:11.5px}
.nb-desc-txt{color:#374151;line-height:1.5;font-size:11.5px;display:flex;flex-direction:column;gap:4px}
.nb-desc-intro{font-size:11.5px;color:#374151;font-style:italic;line-height:1.45}
.nb-desc-filter-hd{font-size:11px;font-weight:700;color:#0070F2;text-transform:uppercase;
  letter-spacing:.06em;margin-top:2px}
body.dark-mode .nb-desc-intro{color:#CDD5E0}
body.dark-mode .nb-desc-filter-hd{color:#4CB1FF}
/* compact bullet list inside desc-box */
.nb-desc-list{margin:0;padding-left:16px;color:#374151;
  font-size:11.5px;line-height:1.5;list-style:disc}
.nb-desc-list li{margin-bottom:2px}
.nb-desc-list li:last-child{margin-bottom:0}
body.dark-mode .nb-desc-list{color:#CDD5E0}
/* ── Below-header filter rules block (Tab 2) ───────────────────────── */
.nb-filter-rules{margin-bottom:12px;padding:10px 14px;
  background:#F8F9FF;border:1px solid #E4E8F5;border-radius:8px}
.nb-filter-rules-hd{font-size:11px;font-weight:700;color:#0070F2;
  text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.nb-filter-rules-list{margin:0;padding-left:18px;list-style:disc;
  color:#374151;font-size:11.5px;line-height:1.5}
.nb-filter-rules-list li{margin-bottom:3px}
.nb-filter-rules-list li:last-child{margin-bottom:0}
body.dark-mode .nb-filter-rules{background:#1A2030;border-color:#2A3550}
body.dark-mode .nb-filter-rules-hd{color:#4CB1FF}
body.dark-mode .nb-filter-rules-list{color:#CDD5E0}
.nb-ph-body-col{flex-direction:column;align-items:flex-start}
.nb-desc-box-full{width:100%;box-sizing:border-box;align-items:flex-start}
.nb-desc-box-full .nb-desc-txt{display:flex;flex-direction:column;gap:5px}
.nb-desc-subhd{font-weight:700;color:#0070F2;font-size:11.5px;margin-top:5px}
.nb-desc-scenario{font-size:11.5px;color:#374151;line-height:1.5;
  padding:4px 10px;border-left:2.5px solid #4CB1FF;background:#F0F8FF;border-radius:0 5px 5px 0}
body.dark-mode .nb-desc-box{background:#0D2235;border-color:#2A5580}
body.dark-mode .nb-desc-lbl{color:#4CB1FF}
body.dark-mode .nb-desc-txt{color:#CDD5E0}
body.dark-mode .nb-desc-subhd{color:#4CB1FF}
body.dark-mode .nb-desc-scenario{color:#CDD5E0;background:#0A1E2E;border-left-color:#2A5580}

.nb-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
  gap:13px;margin-bottom:20px}
.nb-card{background:#FAFBFF;border:1px solid #E4E8F5;border-radius:10px;
  padding:14px 17px;box-shadow:0 1px 5px rgba(0,0,0,.04);
  transition:box-shadow .18s,border-color .18s}
.nb-card:hover{box-shadow:0 4px 18px rgba(0,112,242,.1);border-color:#4CB1FF}
.nb-card-lbl{font-size:10px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;color:#0070F2;margin-bottom:6px}
.nb-card-val{font-size:13px;color:#1a1a2e;line-height:1.6}
.nb-tmpl{background:#F8F9FF;border:1px solid #CDD4F8;border-radius:10px;
  padding:16px 20px;font-family:monospace;font-size:13px;line-height:1.9;
  color:#1a2255;white-space:pre-wrap;word-break:break-word;margin-top:8px}
.nb-tag{display:inline-flex;align-items:center;padding:4px 11px;
  border-radius:20px;font-size:11px;font-weight:600;margin:3px 3px 3px 0}
.nb-tag-blue{background:#E1F4FF;color:#0070F2;border:1px solid #4CB1FF}
.nb-tag-red{background:#FFF0EE;color:#C44A3A;border:1px solid #FFAD9F}
.nb-tag-green{background:#EFFFF1;color:#1F7A3A;border:1px solid #7BC996}
.nb-tag-gold{background:#FFF8E5;color:#8A6000;border:1px solid #D4AF37}
.nb-tag-gray{background:#F3F4F6;color:#4B5563;border:1px solid #D1D5DB}
.nb-steps{counter-reset:ns;list-style:none;padding:0;margin:0}
.nb-steps li{counter-increment:ns;display:flex;align-items:flex-start;
  gap:12px;padding:11px 0;border-bottom:1px solid #F2F4FA}
.nb-steps li:last-child{border-bottom:none}
.nb-steps li::before{content:counter(ns);min-width:24px;height:24px;
  border-radius:50%;background:#0070F2;color:#fff;font-size:11px;font-weight:700;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;margin-top:1px}
/* Cases data */
.nb-cases-state{text-align:center;padding:60px 20px;color:#6B7280}
.nb-spinner{width:38px;height:38px;border:3px solid #E1F4FF;
  border-top-color:#0070F2;border-radius:50%;
  animation:nbspin .75s linear infinite;margin:0 auto 14px}
@keyframes nbspin{to{transform:rotate(360deg)}}


.nb-cases-tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.nb-cases-tbl th{background:#F0F4FF;color:#00144A;font-weight:700;
  padding:9px 12px;text-align:left;border-bottom:2px solid #D4DCF5;
  font-size:11px;letter-spacing:.04em;white-space:nowrap;position:sticky;top:0}
.nb-cases-tbl td{padding:8px 12px;border-bottom:1px solid #F0F2FA;
  color:#2d2d40;vertical-align:top;white-space:nowrap}
.nb-cases-tbl tr:hover td{background:#F5F8FF}
.nb-cases-tbl tbody tr:last-child td{border-bottom:none}
.nb-tbl-wrap{overflow-x:auto;border-radius:8px;
  border:1px solid #E4E8F5;flex:1;min-height:0;overflow-y:auto}


/* ── Cases Description Card ────────────────────────────────────────────── */
.cg-desc-card{background:linear-gradient(135deg,#F0F6FF 0%,#E8F3FF 100%);border:1.5px solid #C8DEFF;border-radius:12px;padding:16px 20px;margin-bottom:20px;position:relative}
.cg-desc-view{display:flex;align-items:flex-start;gap:12px}
.cg-desc-icon{font-size:22px;flex-shrink:0;margin-top:2px}
.cg-desc-body{flex:1;min-width:0}
.cg-desc-text{font-size:13.5px;color:#1a2255;line-height:1.65;font-weight:400}
.cg-desc-edit-btn{flex-shrink:0;margin-top:1px;padding:5px 13px;background:#fff;border:1.5px solid #C0CDE8;border-radius:7px;font-size:11.5px;color:#0070F2;font-weight:600;cursor:pointer;transition:border-color .18s,background .18s;white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.cg-desc-edit-btn:hover{background:#E8F2FF;border-color:#0070F2}
.cg-desc-edit-area{display:none;margin-top:12px}
.cg-desc-ta{width:100%;min-height:74px;padding:10px 13px;border:1.5px solid #C0CDE8;border-radius:8px;font-size:13.5px;color:#1a2255;line-height:1.6;resize:vertical;box-sizing:border-box;font-family:inherit;background:#fff;transition:border-color .18s,box-shadow .18s}
.cg-desc-ta:focus{border-color:#0070F2;outline:none;box-shadow:0 0 0 3px rgba(0,112,242,.1)}
.cg-desc-edit-btns{display:flex;gap:8px;margin-top:10px}
.cg-desc-save-btn{padding:7px 20px;background:#0070F2;color:#fff;border:none;border-radius:7px;font-size:12px;font-weight:600;cursor:pointer;transition:background .18s}
.cg-desc-save-btn:hover{background:#005FCC}
.cg-desc-cancel-btn{padding:7px 16px;background:#fff;color:#6B7280;border:1.5px solid #D0D4E4;border-radius:7px;font-size:12px;cursor:pointer;transition:border-color .18s,color .18s}
.cg-desc-cancel-btn:hover{border-color:#0070F2;color:#0070F2}

/* ── Dark / Light mode ──────────────────────────────────────────────── */
body.dark-mode{
  --grey-1:#1D2329;--grey-2:#373737;--grey-3:#555B62;
  --grey-4:#9CA3AF;--grey-5:#D1D5DB;
  --white:#1D2329;--text:#F9FAFB;
  --blue-light:#223548;--green-light:#14281E;
  --red-light:#2D1210;--purple-light:#1E1A30;
  --teal-light:#122020;--gold-light:#2E2200;
  background:var(--grey-1);color:var(--text)
}
body.dark-mode .topnav{background:#0D1117}
body.dark-mode .tabbar{background:#1D2329;border-bottom-color:#373737}
body.dark-mode .tab:hover{background:#252B33}
body.dark-mode .login-card,
body.dark-mode .stat-card,
body.dark-mode .file-card,
body.dark-mode .analytics-card,
body.dark-mode .admin-section,
body.dark-mode .nb-content-col,
body.dark-mode .nb-filter-col{background:#252B33;color:var(--text)}
body.dark-mode .nb-flags-col{background:#1A2030}
body.dark-mode .nb-flag{background:#252B33;border-color:#373737;color:var(--grey-4)}
body.dark-mode .nb-flag.nb-active{background:#00144A;color:#4CB1FF}
body.dark-mode .nb-cases-tbl th{background:#1A2030;color:#4CB1FF}
body.dark-mode .nb-cases-tbl td{border-bottom-color:#373737}
body.dark-mode .nb-cases-tbl tr:hover td{background:#252B33}
body.dark-mode .nb-filter-col .nb-fg-header{color:#9CA3AF}
body.dark-mode .cg-desc-card{background:#1E2530;border-color:#373737}
body.dark-mode .nb-tbl-wrap{background:#1D2329}
body.dark-mode input,body.dark-mode select,body.dark-mode textarea{background:#252B33;color:var(--text);border-color:#555B62}
body.dark-mode .modal-content{background:#252B33;color:var(--text)}
body.dark-mode .nb-ph{border-bottom-color:#373737}
body.dark-mode .nb-sub{color:#4CB1FF}
body.dark-mode .nb-title-edit-btn{color:#4CB1FF}
/* dark scroll */
body.dark-mode ::-webkit-scrollbar-track{background:#1D2329}
body.dark-mode ::-webkit-scrollbar-thumb{background:#555B62}

/* ── Theme toggle button ─────────────────────────────────────────────── */
.theme-btn{background:transparent;border:1.5px solid rgba(255,255,255,.25);
  border-radius:20px;width:36px;height:36px;display:flex;align-items:center;
  justify-content:center;cursor:pointer;color:var(--white);font-size:16px;
  transition:var(--t);flex-shrink:0}
.theme-btn:hover{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.5)}

/* ── Act-on-Behalf button ────────────────────────────────────────────── */
.aob-btn{background:transparent;border:1.5px solid rgba(255,180,0,.35);
  border-radius:20px;width:36px;height:36px;display:flex;align-items:center;
  justify-content:center;cursor:pointer;color:var(--gold);font-size:15px;
  transition:var(--t);flex-shrink:0;position:relative}
.aob-btn:hover{background:rgba(232,160,0,.12);border-color:var(--gold)}
.aob-active-dot{position:absolute;top:3px;right:3px;width:8px;height:8px;
  background:#22C55E;border-radius:50%;border:1.5px solid #111}

/* ── AoB active banner ─────────────────────────────────────────────────── */
#aobBanner{display:none;position:sticky;top:60px;z-index:199;
  background:#E8A000;padding:0 20px;height:38px;align-items:center;
  justify-content:space-between;gap:12px;box-shadow:0 2px 6px rgba(0,0,0,.25)}
#aobBanner.active{display:flex}
.aob-banner-left{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.aob-banner-left svg{flex-shrink:0}
.aob-banner-email{font-weight:700;max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.aob-banner-exit{display:flex;align-items:center;gap:5px;background:#fff;color:#92400E;
  border:none;border-radius:5px;padding:4px 12px;font-size:12px;font-weight:700;
  cursor:pointer;white-space:nowrap;flex-shrink:0;transition:background .15s}
.aob-banner-exit:hover{background:#FFF7ED}

/* ── AoB modal ────────────────────────────────────────────────────────── */
#aobModal{display:none;position:fixed;inset:0;z-index:9000;
  background:rgba(0,0,0,.55);align-items:center;justify-content:center}
#aobModal.open{display:flex}
#aobModal .aob-card{background:var(--white);border-radius:var(--rl);
  box-shadow:var(--lg);padding:32px 36px;max-width:420px;width:90%;
  position:relative}
body.dark-mode #aobModal .aob-card{background:#252B33}
#aobModal h3{font-size:16px;font-weight:700;color:var(--text);margin-bottom:6px}
#aobModal p.aob-hint{font-size:12.5px;color:var(--grey-4);margin-bottom:18px}
#aobEmailInput{width:100%;padding:9px 12px;border:1.5px solid var(--grey-3);
  border-radius:8px;font-size:13.5px;font-family:var(--f);background:var(--grey-1);
  color:var(--text);margin-bottom:4px;transition:var(--t)}
#aobEmailInput:focus{outline:none;border-color:var(--blue)}
#aobSuggestions{position:relative;width:100%;margin-bottom:12px}
#aobSugList{display:none;position:absolute;top:0;left:0;right:0;z-index:9999;
  background:var(--white);border:1.5px solid var(--blue);border-radius:8px;
  box-shadow:0 4px 16px rgba(0,0,0,.12);max-height:220px;overflow-y:auto}
body.dark-mode #aobSugList{background:#252B33;border-color:#4CB1FF}
.aob-sug-item{padding:9px 12px;cursor:pointer;font-size:12.5px;
  display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--grey-2)}
.aob-sug-item:last-child{border-bottom:none}
.aob-sug-item:hover{background:var(--blue-light)}
body.dark-mode .aob-sug-item:hover{background:#1A2E44}
.aob-sug-name{font-weight:600;color:var(--text)}
.aob-sug-email{font-size:11px;color:var(--grey-4)}
.aob-actions{display:flex;gap:10px;justify-content:flex-end}
#aobClearBtn{display:none}

/* ── nb-ph title edit ─────────────────────────────────────────────────── */
.nb-ph{display:flex;align-items:center;gap:14px;padding:14px 0 14px;
  border-bottom:1px solid var(--grey-2);margin-bottom:14px;position:relative}
.nb-title-edit-btn{background:none;border:none;cursor:pointer;
  font-size:14px;color:var(--blue);opacity:0;transition:var(--t);
  padding:2px 6px;border-radius:4px;line-height:1;display:none}
.nb-ph:hover .nb-title-edit-btn{opacity:1}
.nb-title-edit-area{display:none;width:100%}
.nb-title-ta{width:100%;padding:6px 8px;border:1.5px solid var(--blue);
  border-radius:6px;font-size:15px;font-weight:700;font-family:var(--f);
  resize:none;color:var(--text);background:var(--white);margin-bottom:6px}
body.dark-mode .nb-title-ta{background:#252B33;color:var(--text)}
.nb-title-edit-btns{display:flex;gap:8px}
.nb-title-edit-btns button{padding:4px 12px;font-size:12.5px;border-radius:6px;
  border:none;cursor:pointer;font-family:var(--f);font-weight:600}
.nb-title-save-btn{background:var(--blue);color:#fff}
.nb-title-cancel-btn{background:var(--grey-2);color:var(--text)}

/* ── Table sort + checkbox ────────────────────────────────────────────── */
.nb-cases-tbl th.sortable{cursor:pointer;user-select:none;white-space:nowrap}
.nb-cases-tbl th.sortable:hover{background:#E8EDFF}
body.dark-mode .nb-cases-tbl th.sortable:hover{background:#1E2A40}
.nb-cases-tbl th.sort-asc::after{content:" ▲";font-size:10px;color:var(--blue)}
.nb-cases-tbl th.sort-desc::after{content:" ▼";font-size:10px;color:var(--blue)}




/* ── Sidebar upload metadata badge ─────────────────────────────────────── */
#cgFileMeta{
  display:none;align-items:center;gap:5px;
  flex-wrap:wrap;
  background:rgba(255,255,255,0.92);
  border:1px solid #D0D9F0;
  border-radius:10px;
  padding:6px 10px;
  font-size:10.5px;color:#374151;
  box-shadow:0 1px 4px rgba(0,0,0,.08);
  pointer-events:none;
  line-height:1.5;
  width:100%;
  box-sizing:border-box;
  word-break:break-word;
  margin-top:auto;
}
body.dark-mode #cgFileMeta{
  background:rgba(30,36,46,0.92);
  border-color:#373737;
  color:#CDD5E0;
}

/* ── Collapsible filter panel ──────────────────────────────────────────── */
.nb-filter-col{transition:width .28s cubic-bezier(.4,0,.2,1),min-width .28s cubic-bezier(.4,0,.2,1)}
.nb-filter-col.nb-fc-collapsed{width:36px;min-width:36px}
.nb-filter-col.nb-fc-collapsed .nb-filter-inner{opacity:0;pointer-events:none;overflow:hidden;width:0;min-width:0;padding:0;flex:none;transition:none}
.nb-filter-inner{transition:opacity .18s ease}
.nb-flt-collapse-strip{display:none;flex-direction:column;align-items:center;padding:10px 0 10px;gap:10px;flex:1;min-height:0}
.nb-filter-col.nb-fc-collapsed .nb-flt-collapse-strip{display:flex}
.nb-flt-toggle-btn{width:26px;height:26px;border-radius:50%;background:#E4E8F5;border:1.5px solid #D0D4E4;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:10px;color:#374151;padding:0;flex-shrink:0;line-height:1;transition:background .18s,color .18s,border-color .18s}
.nb-flt-toggle-btn:hover{background:#D0D8F4;color:#0070F2;border-color:#A0ADEF}
.nb-flt-vert-lbl{font-size:9px;font-weight:700;color:#9CA3AF;writing-mode:vertical-rl;text-orientation:mixed;transform:rotate(180deg);letter-spacing:.14em;user-select:none;white-space:nowrap}
.nb-flt-active-dot{width:7px;height:7px;border-radius:50%;background:#0070F2;display:none;margin-top:auto;flex-shrink:0}
.nb-flt-active-dot.on{display:block}
body.dark-mode .nb-flt-toggle-btn{background:#2A3240;border-color:#373737;color:#9CA3AF}
body.dark-mode .nb-flt-toggle-btn:hover{background:#333D50;color:#4CB1FF;border-color:#4CB1FF}
body.dark-mode .nb-flt-vert-lbl{color:#4B5563}
body.dark-mode .nb-flt-active-dot{background:#4CB1FF}
/* ── Filter panel — dropdown selects & agent search ─────── */
.nb-flt-section{margin-bottom:12px}
.nb-flt-section-lbl{display:block;font-size:11px;font-weight:600;color:#4B5563;margin-bottom:5px;letter-spacing:.01em;padding:0 1px}
.nb-flt-select{width:100%;padding:7px 10px;font-size:12px;border:1.5px solid #D0D4E4;border-radius:6px;background:#fff;color:var(--text);cursor:pointer;outline:none;font-family:inherit;transition:border-color .15s;box-sizing:border-box}
.nb-flt-select:focus{border-color:#0070F2}
.nb-flt-agent-wrap{position:relative}
.nb-flt-agent-wrap input{width:100%;padding:7px 10px 7px 30px;font-size:12px;border:1.5px solid #D0D4E4;border-radius:6px;background:#fff;color:var(--text);outline:none;font-family:inherit;transition:border-color .15s;box-sizing:border-box}
.nb-flt-agent-wrap input:focus{border-color:#0070F2}
.nb-flt-agent-ico{position:absolute;left:9px;top:50%;transform:translateY(-50%);font-size:11px;color:#9CA3AF;pointer-events:none;line-height:1}
body.dark-mode .nb-flt-select{background:#1A2230;border-color:#373737;color:#E5E7EB}
body.dark-mode .nb-flt-agent-wrap input{background:#1A2230;border-color:#373737;color:#E5E7EB}
body.dark-mode .nb-flt-section-lbl{color:#9CA3AF}

/* ── Case Count Date Range Comparison ─────────────────────────────── */
.cc-compare-wrap{background:#F8F9FF;border:1.5px solid #D0D8F4;border-radius:10px;padding:14px 16px;margin-bottom:16px}
.cc-compare-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.cc-compare-lbl{font-size:11.5px;font-weight:700;color:#374151;white-space:nowrap}
.cc-compare-date{padding:6px 10px;border:1.5px solid #D0D4E4;border-radius:6px;font-size:12.5px;font-family:inherit;color:#1a1a2e;background:#fff;cursor:pointer;transition:border-color .15s}
.cc-compare-date:focus{border-color:#0070F2;outline:none}
.cc-compare-btn{padding:6px 16px;background:#0070F2;color:#fff;border:none;border-radius:6px;font-size:12.5px;font-weight:600;font-family:inherit;cursor:pointer;transition:background .15s;white-space:nowrap}
.cc-compare-btn:hover{background:#005FCC}
.cc-compare-result{display:none}
.cc-compare-cards{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:8px;align-items:center;margin-bottom:12px}
.cc-crd{background:#fff;border:1.5px solid #E4E8F5;border-radius:9px;padding:12px 14px;text-align:center}
.cc-crd-lbl{font-size:10px;font-weight:700;color:#6B7280;text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px}
.cc-crd-date{font-size:12px;font-weight:700;color:#374151;margin-bottom:6px}
.cc-crd-total{font-size:28px;font-weight:700;color:#00144A;line-height:1}
.cc-crd-sub{font-size:10.5px;color:#6B7280;margin-top:3px}
.cc-crd-arrow{font-size:22px;color:#D0D4E4;text-align:center}
.cc-crd-delta{background:#fff;border:2px solid #0070F2;border-radius:9px;padding:12px 14px;text-align:center}
.cc-delta-num{font-size:28px;font-weight:700;line-height:1}
.cc-delta-num.up{color:#DC0D15}.cc-delta-num.dn{color:#00BEAE}.cc-delta-num.nc{color:#9CA3AF}
.cc-delta-lbl{font-size:10.5px;color:#6B7280;margin-top:3px}
.cc-compare-breakdown{width:100%;border-collapse:collapse;font-size:12px}
.cc-compare-breakdown th{background:#EEF2FF;color:#374151;font-weight:700;padding:7px 10px;text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;border-bottom:2px solid #D4DCF5;white-space:nowrap}
.cc-compare-breakdown td{padding:7px 10px;border-bottom:1px solid #F0F2FA;color:#374151;vertical-align:middle}
.cc-compare-breakdown tr:last-child td{border-bottom:none}
.cc-compare-breakdown tr:hover td{background:#F5F8FF}
.cc-compare-breakdown .td-num{font-weight:600;text-align:right}
.cc-compare-breakdown .td-delta{text-align:right;font-weight:600;min-width:60px}
.cc-compare-breakdown .td-delta.up{color:#DC0D15}
.cc-compare-breakdown .td-delta.dn{color:#00BEAE}
